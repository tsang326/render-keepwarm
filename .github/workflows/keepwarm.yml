name: keep-warm

# Render's free plan puts a service to sleep after 15 idle minutes. During
# judging (1-15 Dec 2026) this pings both apps every 5 minutes so a judge
# never waits for a cold start. A scheduled run is started every 5 hours and
# loops for just under 6 hours, so a late GitHub schedule leaves no gap.
on:
  schedule:
    - cron: "7 */5 * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "Ping once now, ignoring the date window"
        type: boolean
        default: true

concurrency:
  group: keepwarm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      URLS: >-
        https://errand-46ur.onrender.com/api/health
        https://interlock-n8ya.onrender.com/api/health
      FROM: "2026-12-01T08:00:00Z"
      TO: "2026-12-16T08:00:00Z"
    steps:
      - name: ping
        run: |
          ping_all() {
            for u in $URLS; do
              code=$(curl -s -o /dev/null -m 90 -w '%{http_code}' "$u" || echo 000)
              echo "$(date -u +%FT%TZ) $code $u"
            done
          }
          if [ "${{ inputs.once }}" = "true" ]; then ping_all; exit 0; fi
          from=$(date -ud "$FROM" +%s); to=$(date -ud "$TO" +%s)
          end=$(( $(date +%s) + 345*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            now=$(date +%s)
            if [ "$now" -lt "$from" ] || [ "$now" -ge "$to" ]; then
              echo "outside $FROM .. $TO, nothing to do"; exit 0
            fi
            ping_all
            sleep 300
          done
